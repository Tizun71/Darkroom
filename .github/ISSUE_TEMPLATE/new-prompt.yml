name: Submit a prompt
description: Share an image and its prompt without opening a pull request. A maintainer adds it for you.
title: "Prompt: "
labels: ["new prompt"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a pull request if you can. It is faster and you get credited in the git history.
        Drag your image into the Image box below.
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: Harbor at dawn
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: Midjourney v7
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: The exact prompt, including flags like --ar.
      render: text
    validations:
      required: true
  - type: textarea
    id: negative
    attributes:
      label: Negative prompt
      description: Optional.
      render: text
  - type: input
    id: tags
    attributes:
      label: Tags
      placeholder: landscape, morning, film
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Drag and drop the image here. Under 1.5 MB, long edge between 512 and 2560 px.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: I generated this image myself and I am fine with the prompt being public.
          required: true
        - label: No real people's likeness, no explicit content, no logos or trademarked characters.
          required: true
