name: Check content

on:
  pull_request:
  workflow_dispatch: # started by intake.yml for the pull requests it opens
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate prompts and images
        run: npm run check
      - name: Build the site
        run: npm run build
